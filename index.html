<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 工具地图 | AI Tool Map</title>
  <meta name="description" content="按场景挑选 AI 工具：写作、图像视频、编程、办公。每日新品扫描与双语目录。 | Scenario-based AI tool directory with daily scans." />
  <meta property="og:title" content="AI 工具地图 | AI Tool Map" />
  <meta property="og:description" content="按场景挑选 AI 工具：写作、图像视频、编程、办公。每日新品扫描与双语目录。" />
  <meta property="og:type" content="website" />
  <meta name="robots" content="index,follow" />
  <meta property="og:locale" content="zh_CN" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="https://goofugoofu.github.io/" />
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    bootPage({
      active: "home",
      metaKey: "meta_desc_home",
      render: async (ui) => {
        const main = document.getElementById("main");
        const [scenarios, tools, daily] = await Promise.all([
          fetchJSON("data/scenarios.json"),
          fetchJSON("data/tools.json"),
          fetchJSON("data/daily.json"),
        ]);
        const today = "2026-10-16";
        const todayItems = daily.filter((d) => d.date === today).slice(0, 4);

        const scenarioCards = scenarios.map((s) => {
          const count = tools.filter((t) => t.scenarios.includes(s.id)).length;
          return `
            <a class="card card-scenario" href="scenario.html?id=${encodeURIComponent(s.id)}">
              <div class="card-icon">${s.icon}</div>
              <h3>${escapeHTML(tField(s, "name"))}</h3>
              <p>${escapeHTML(tField(s, "desc"))}</p>
              <div class="meta-row"><span class="badge">${count} ${ui.tools_count}</span></div>
            </a>
          `;
        }).join("");

        const dailyHTML = todayItems.map((d) => `
          <article class="feed-item">
            <div class="date">${escapeHTML(d.date)}</div>
            <h3>${escapeHTML(tField(d, "title"))}</h3>
            <p>${escapeHTML(tField(d, "summary"))}</p>
          </article>
        `).join("");

        const featured = tools.filter((t) => t.is_new_this_week).slice(0, 6);
        const allPreview = tools.slice(0, 9);

        injectJsonLd("ld-website", {
          "@context": "https://schema.org",
          "@type": "WebSite",
          name: "AI Tool Map",
          alternateName: "AI 工具地图",
          url: "https://goofugoofu.github.io/",
          inLanguage: ["zh-CN", "en"],
          description: ui.meta_desc_home || "Scenario-based bilingual AI tool directory",
        });
        injectJsonLd("ld-itemlist", {
          "@context": "https://schema.org",
          "@type": "ItemList",
          name: "AI tool scenarios",
          itemListElement: scenarios.map((s, n) => ({
            "@type": "ListItem",
            position: n + 1,
            name: tField(s, "name"),
            url: new URL(`scenario.html?id=${encodeURIComponent(s.id)}`, location.href).href,
          })),
        });

        main.innerHTML = `
          <section class="hero">
            <h1 data-i18n="site_name">${ui.site_name}</h1>
            <p data-i18n="tagline">${ui.tagline}</p>
            <div class="howto" aria-label="${ui.howto_title}">
              <div class="howto-step">
                <span class="num">1</span>
                <strong data-i18n="howto_1_title">${ui.howto_1_title}</strong>
                <span data-i18n="howto_1_desc">${ui.howto_1_desc}</span>
              </div>
              <div class="howto-step">
                <span class="num">2</span>
                <strong data-i18n="howto_2_title">${ui.howto_2_title}</strong>
                <span data-i18n="howto_2_desc">${ui.howto_2_desc}</span>
              </div>
              <div class="howto-step">
                <span class="num">3</span>
                <strong data-i18n="howto_3_title">${ui.howto_3_title}</strong>
                <span data-i18n="howto_3_desc">${ui.howto_3_desc}</span>
              </div>
            </div>
            <div class="quick-links">
              <a class="quick-link" href="daily.html"><span class="emoji">📰</span><span data-i18n="quick_daily">${ui.quick_daily}</span></a>
              <a class="quick-link" href="weekly.html"><span class="emoji">✨</span><span data-i18n="quick_weekly">${ui.quick_weekly}</span></a>
              <a class="quick-link" href="subscribe.html"><span class="emoji">✉️</span><span data-i18n="quick_subscribe">${ui.quick_subscribe}</span></a>
            </div>
          </section>

          <section class="section">
            <div class="section-head">
              <div>
                <h2 data-i18n="scenarios_title">${ui.scenarios_title}</h2>
                <p data-i18n="scenarios_sub">${ui.scenarios_sub}</p>
              </div>
            </div>
            <p class="help-hint" data-i18n="scenarios_hint">${ui.scenarios_hint}</p>
            <div class="grid grid-scenarios">${scenarioCards}</div>
          </section>

          <section class="section">
            <div class="section-head">
              <div>
                <h2 data-i18n="today_title">${ui.today_title}</h2>
                <p data-i18n="today_sub">${ui.today_sub}</p>
              </div>
              <div class="quick-links" style="margin:0">
                <a class="quick-link" href="daily.html" data-i18n="view_all_daily">${ui.view_all_daily}</a>
                <a class="quick-link" href="weekly.html" data-i18n="view_weekly">${ui.view_weekly}</a>
              </div>
            </div>
            <div class="feed">${dailyHTML || emptyState(ui)}</div>
          </section>

          <section class="section">
            <div class="section-head">
              <div>
                <h2 data-i18n="new_section_title">${ui.new_section_title}</h2>
                <p data-i18n="new_section_sub">${ui.new_section_sub}</p>
              </div>
            </div>
            <div class="grid">${featured.length ? featured.map((t) => toolCardHTML(t, ui)).join("") : emptyState(ui, "tools")}</div>
          </section>

          <section class="section">
            <div class="section-head">
              <div>
                <h2 data-i18n="all_tools">${ui.all_tools}</h2>
                <p data-i18n="all_tools_sub">${ui.all_tools_sub}</p>
              </div>
              <input type="search" id="home-search" class="search-box" data-i18n-placeholder="search_placeholder" placeholder="${ui.search_placeholder}" />
            </div>
            <div class="grid" id="all-tools-grid">
              ${allPreview.map((t) => toolCardHTML(t, ui)).join("")}
            </div>
          </section>
        `;

        applyStaticUI(ui);

        const search = document.getElementById("home-search");
        const grid = document.getElementById("all-tools-grid");
        search.addEventListener("input", () => {
          const q = search.value.trim().toLowerCase();
          const filtered = !q
            ? tools.slice(0, 9)
            : tools.filter((t) => {
                const blob = [
                  t.name_zh, t.name_en, t.one_liner_zh, t.one_liner_en, ...(t.scenarios || [])
                ].join(" ").toLowerCase();
                return blob.includes(q);
              });
          grid.innerHTML = filtered.length
            ? filtered.map((t) => toolCardHTML(t, ui)).join("")
            : emptyState(ui, "search");
        });
      },
    });
  </script>
</body>
</html>
