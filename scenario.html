<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>场景 · AI 工具地图 | Scenarios</title>
  <meta name="description" content="按场景浏览推荐的 AI 工具。 | Browse recommended AI tools by scenario." />
  <meta property="og:title" content="场景 · AI 工具地图 | Scenarios" />
  <meta property="og:description" content="按场景浏览推荐的 AI 工具。" />
  <meta property="og:type" content="website" />
  <meta name="robots" content="index,follow" />
  <meta property="og:locale" content="zh_CN" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="https://goofugoofu.github.io/scenario.html" />
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    bootPage({
      active: "home",
      render: async (ui) => {
        const main = document.getElementById("main");
        const id = qs("id");
        const [scenarios, tools] = await Promise.all([
          fetchJSON("data/scenarios.json"),
          fetchJSON("data/tools.json"),
        ]);
        const scenario = scenarios.find((s) => s.id === id);
        if (!scenario) {
          main.innerHTML = `${emptyState(ui)}<p><a class="back-link" href="index.html">${ui.back_home}</a></p>`;
          applyStaticUI(ui);
          return;
        }
        const list = tools.filter((t) => t.scenarios.includes(id));
        document.title = `${tField(scenario, "name")} · AI Tool Map`;
        setPageMeta({
          title: `${tField(scenario, "name")} · ${ui.site_name}`,
          description: tField(scenario, "desc") || ui.meta_desc_scenario,
        });
        injectJsonLd("ld-scenario", {
          "@context": "https://schema.org",
          "@type": "ItemList",
          name: tField(scenario, "name"),
          description: tField(scenario, "desc"),
          numberOfItems: list.length,
          itemListElement: list.slice(0, 30).map((t, n) => ({
            "@type": "ListItem",
            position: n + 1,
            name: tField(t, "name"),
            url: new URL(`tool.html?id=${encodeURIComponent(t.id)}`, location.href).href,
          })),
        });
        main.innerHTML = `
          <section class="detail-hero">
            <a class="back-link" href="index.html" data-i18n="back_home">${ui.back_home}</a>
            <div class="card-icon" style="font-size:2.2rem">${scenario.icon}</div>
            <h1>${escapeHTML(tField(scenario, "name"))}</h1>
            <p class="muted">${escapeHTML(tField(scenario, "desc"))}</p>
          </section>
          <section class="section">
            <div class="section-head">
              <h2 data-i18n="scenario_tools">${ui.scenario_tools}</h2>
              <span class="badge">${list.length} ${ui.tools_count}</span>
            </div>
            <p class="help-hint" data-i18n="scenario_hint">${ui.scenario_hint}</p>
            <div class="grid">
              ${list.length ? list.map((t) => toolCardHTML(t, ui)).join("") : emptyState(ui)}
            </div>
          </section>
        `;
        applyStaticUI(ui);
      },
    });
  </script>
</body>
</html>
